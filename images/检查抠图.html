<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>新抠图检查</title>
<style>
  body { margin: 16px; font-family: sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .item { width: 130px; text-align: center; }
  img { width: 120px; height: 120px; object-fit: contain; border-radius: 12px; }
  .red { background: #ff8a8a; }
  .mint { background: #e8f7f0; }
  .white { background: #fff; border: 1px solid #eee; }
  .name { font-size: 12px; margin-top: 4px; }
  h2 { font-size: 16px; }
</style>
</head>
<body>
<h2>新版抠图检查：人物应完整、背景应透明</h2>
<div class="row">
  <div class="item"><img class="red" src="mascot_idle.webp"><div class="name">男·待机</div></div>
  <div class="item"><img class="red" src="mascot_energetic.webp"><div class="name">男·轻松</div></div>
  <div class="item"><img class="red" src="mascot_happy.webp"><div class="name">男·合适</div></div>
  <div class="item"><img class="red" src="mascot_tired.webp"><div class="name">男·太累</div></div>
</div>
<div class="row">
  <div class="item"><img class="mint" src="girl_idle.webp"><div class="name">女·待机</div></div>
  <div class="item"><img class="mint" src="girl_energetic.webp"><div class="name">女·轻松</div></div>
  <div class="item"><img class="mint" src="girl_happy.webp"><div class="name">女·合适</div></div>
  <div class="item"><img class="mint" src="girl_tired.webp"><div class="name">女·太累</div></div>
</div>
</body>
</html>
